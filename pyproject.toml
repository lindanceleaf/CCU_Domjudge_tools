[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccu-domjudge-tools"
version = "0.1.0"
description = "Small command-line tools for preparing DOMjudge courses and problems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "requests>=2.31,<3",
]

[project.scripts]
ccudj = "domjudge_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

